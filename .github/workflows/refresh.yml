# Runs on GitHub's servers, so your PC can be off.
# Every day: pull fresh ads -> rescore -> publish the site to GitHub Pages.
name: Refresh ads and deploy

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_ACTOR: ${{ vars.APIFY_ACTOR }}
      APIFY_INPUT: ${{ vars.APIFY_INPUT }}
      APIFY_QUERIES: ${{ vars.APIFY_QUERIES }}
      APIFY_COUNTRY: ${{ vars.APIFY_COUNTRY }}
      APIFY_LIMIT: ${{ vars.APIFY_LIMIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ingest from Meta Ad Library API
        if: env.META_TOKEN != ''
        env:
          AD_QUERIES: ${{ vars.AD_QUERIES }}
          AD_COUNTRIES: ${{ vars.AD_COUNTRIES }}
        run: |
          IFS=',' read -ra QS <<< "${AD_QUERIES:-sleep,collagen,skincare}"
          for q in "${QS[@]}"; do
            node ingest.js --source graph --query "$q" --countries "${AD_COUNTRIES:-EE,DE,FR}"
          done

      - name: Ingest from Apify scraper
        if: env.APIFY_TOKEN != ''
        env:
          APIFY_ACTOR: ${{ vars.APIFY_ACTOR || 'curious_coder~facebook-ads-library-scraper' }}
        run: node ingest.js --source apify

      - name: Keep ad history in the repo
        run: |
          git config user.name "adreels-bot"
          git config user.email "adreels-bot@users.noreply.github.com"
          git add data/ads.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Refresh ads" && git push)

      - name: Build site
        run: node build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
